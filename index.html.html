<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindFlow - Modern Mind Mapping</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
        /* Grid Canvas Background */
        .bg-grid-light {
            background-size: 24px 24px;
            background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
        }
        .dark .bg-grid-dark {
            background-size: 24px 24px;
            background-image: radial-gradient(circle, #334155 1px, transparent 1px);
        }
        /* Custom styling for editable text */
        .node-text-input:focus {
            outline: none;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col antialiased transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header class="h-14 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                <i class="fa-solid fa-sitemap text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight leading-none bg-gradient-to-r from-sky-600 to-indigo-600 dark:from-sky-400 dark:to-indigo-400 bg-clip-text text-transparent">
                    MindFlow
                </h1>
                <span class="text-[10px] text-slate-400 font-medium">Interactive Mind Mapping</span>
            </div>
        </div>

        <!-- Action Toolbar -->
        <div class="flex items-center space-x-1 sm:space-x-2 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200/80 dark:border-slate-700/80">
            <button id="btn-add-child" title="Add Child Node (Tab)" class="px-2.5 py-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-medium flex items-center space-x-1.5 transition-all shadow-none hover:shadow-sm">
                <i class="fa-solid fa-plus text-sky-500"></i>
                <span class="hidden md:inline">Add Child</span>
            </button>
            <button id="btn-add-sibling" title="Add Sibling Node (Enter)" class="px-2.5 py-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-medium flex items-center space-x-1.5 transition-all shadow-none hover:shadow-sm">
                <i class="fa-solid fa-level-down-alt rotate-90 text-indigo-500"></i>
                <span class="hidden md:inline">Add Sibling</span>
            </button>
            <div class="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 mx-1"></div>
            <button id="btn-delete-node" title="Delete Selected Node (Del)" class="px-2.5 py-1.5 hover:bg-rose-50 dark:hover:bg-rose-950/40 text-rose-600 dark:text-rose-400 rounded-lg text-xs font-medium flex items-center space-x-1.5 transition-all">
                <i class="fa-solid fa-trash-can"></i>
                <span class="hidden md:inline">Delete</span>
            </button>
            <div class="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 mx-1"></div>
            <button id="btn-auto-layout" title="Auto Layout Trees" class="px-2.5 py-1.5 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-medium flex items-center space-x-1.5 transition-all shadow-none hover:shadow-sm">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i>
                <span class="hidden lg:inline">Auto Layout</span>
            </button>
        </div>

        <!-- Right Side Utility Toolbar -->
        <div class="flex items-center space-x-2">
            <!-- Theme Toggle -->
            <button id="btn-theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>

            <!-- Export / Import Dropdown trigger -->
            <div class="relative group">
                <button id="btn-export-menu" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-medium text-xs rounded-xl flex items-center space-x-2 shadow-sm shadow-sky-600/30 transition-all">
                    <i class="fa-solid fa-download"></i>
                    <span>Export/Import</span>
                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>
                <!-- Dropdown -->
                <div class="absolute right-0 mt-1 w-48 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 py-2 hidden group-hover:block group-focus-within:block z-50">
                    <button id="btn-export-png" class="w-full text-left px-4 py-2 text-xs text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center space-x-2">
                        <i class="fa-regular fa-file-image text-emerald-500 w-4"></i>
                        <span>Export as PNG</span>
                    </button>
                    <button id="btn-export-json" class="w-full text-left px-4 py-2 text-xs text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center space-x-2">
                        <i class="fa-regular fa-file-code text-blue-500 w-4"></i>
                        <span>Export as JSON</span>
                    </button>
                    <hr class="my-1 border-slate-100 dark:border-slate-700/60">
                    <label class="w-full text-left px-4 py-2 text-xs text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-file-import text-amber-500 w-4"></i>
                        <span>Import JSON</span>
                        <input type="file" id="file-input-json" accept=".json" class="hidden">
                    </label>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="flex-1 flex relative overflow-hidden">

        <!-- Infinite Canvas Area -->
        <main id="canvas-container" class="flex-1 h-full w-full relative cursor-grab active:cursor-grabbing bg-slate-50 dark:bg-slate-900 bg-grid-light dark:bg-grid-dark overflow-hidden">
            <!-- SVG Overlay for Connectors -->
            <svg id="svg-connectors" class="absolute inset-0 w-full h-full pointer-events-none" style="transform-origin: 0 0;"></svg>

            <!-- Container for rendered MindMap Nodes -->
            <div id="nodes-container" class="absolute inset-0 pointer-events-none" style="transform-origin: 0 0;"></div>

            <!-- Canvas Floating Controls (Zoom / Pan Reset) -->
            <div class="absolute bottom-6 left-6 z-10 bg-white/90 dark:bg-slate-800/90 backdrop-blur border border-slate-200 dark:border-slate-700/80 rounded-2xl p-1.5 shadow-lg flex items-center space-x-1">
                <button id="btn-zoom-in" class="w-8 h-8 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-plus text-xs"></i>
                </button>
                <span id="zoom-level-text" class="text-xs font-semibold px-2 min-w-[3rem] text-center text-slate-600 dark:text-slate-300">100%</span>
                <button id="btn-zoom-out" class="w-8 h-8 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-minus text-xs"></i>
                </button>
                <div class="h-4 w-[1px] bg-slate-200 dark:bg-slate-700 mx-0.5"></div>
                <button id="btn-reset-view" title="Reset View" class="w-8 h-8 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-compress text-xs"></i>
                </button>
            </div>

            <!-- Shortcuts Hint Toast -->
            <div class="absolute bottom-6 right-6 z-10 hidden md:flex items-center space-x-3 bg-white/90 dark:bg-slate-800/90 backdrop-blur border border-slate-200 dark:border-slate-700/80 rounded-2xl px-4 py-2 shadow-lg text-xs text-slate-500 dark:text-slate-400">
                <span><kbd class="px-1.5 py-0.5 bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded font-mono text-[10px]">Tab</kbd> Child</span>
                <span><kbd class="px-1.5 py-0.5 bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded font-mono text-[10px]">Enter</kbd> Sibling</span>
                <span><kbd class="px-1.5 py-0.5 bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded font-mono text-[10px]">Del</kbd> Delete</span>
                <span><kbd class="px-1.5 py-0.5 bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded font-mono text-[10px]">Drag</kbd> Move/Pan</span>
            </div>
        </main>

        <!-- Right Side Panel for Node Customization -->
        <aside id="side-panel" class="w-80 border-l border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md flex flex-col z-20 transition-all duration-300 translate-x-full md:translate-x-0 absolute md:relative right-0 h-full shadow-2xl md:shadow-none">
            <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                <h2 class="font-bold text-slate-800 dark:text-slate-100 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-sky-500"></i>
                    <span>Node Styling</span>
                </h2>
                <button id="btn-close-panel" class="md:hidden text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="panel-content" class="p-4 space-y-6 overflow-y-auto flex-1">
                <!-- Select Prompt when no node selected -->
                <div id="no-selection-prompt" class="text-center py-12 text-slate-400 dark:text-slate-500">
                    <i class="fa-regular fa-hand-pointer text-4xl mb-3 block opacity-50"></i>
                    <p class="text-xs">Select a node on the canvas to customize its layout and visual appearance.</p>
                </div>

                <!-- Customization Controls -->
                <div id="node-controls" class="space-y-5 hidden">
                    <!-- Text / Label Edit -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Node Text</label>
                        <textarea id="prop-text" rows="2" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:outline-none transition-all resize-none"></textarea>
                    </div>

                    <!-- Background Color Presets -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Background Color</label>
                        <div class="grid grid-cols-6 gap-2" id="color-presets">
                            <!-- Preset Buttons Injected dynamically -->
                        </div>
                    </div>

                    <!-- Shape Picker -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Shape Style</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button data-shape="rounded" class="btn-shape p-2 text-xs border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 flex flex-col items-center gap-1 font-medium transition-all">
                                <div class="w-6 h-4 bg-sky-500/20 border border-sky-500 rounded-sm"></div>
                                <span>Rounded</span>
                            </button>
                            <button data-shape="pill" class="btn-shape p-2 text-xs border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 flex flex-col items-center gap-1 font-medium transition-all">
                                <div class="w-6 h-4 bg-sky-500/20 border border-sky-500 rounded-full"></div>
                                <span>Pill</span>
                            </button>
                            <button data-shape="rectangle" class="btn-shape p-2 text-xs border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 flex flex-col items-center gap-1 font-medium transition-all">
                                <div class="w-6 h-4 bg-sky-500/20 border border-sky-500 rounded-none"></div>
                                <span>Rectangle</span>
                            </button>
                        </div>
                    </div>

                    <!-- Text Alignment -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Text Alignment</label>
                        <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                            <button data-align="left" class="btn-align flex-1 py-1.5 text-xs text-center rounded-lg hover:bg-white dark:hover:bg-slate-700 transition-all">
                                <i class="fa-solid fa-align-left"></i>
                            </button>
                            <button data-align="center" class="btn-align flex-1 py-1.5 text-xs text-center rounded-lg hover:bg-white dark:hover:bg-slate-700 transition-all">
                                <i class="fa-solid fa-align-center"></i>
                            </button>
                            <button data-align="right" class="btn-align flex-1 py-1.5 text-xs text-center rounded-lg hover:bg-white dark:hover:bg-slate-700 transition-all">
                                <i class="fa-solid fa-align-right"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Font Size & Formatting -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Text Style</label>
                        <div class="flex items-center space-x-2">
                            <button id="btn-toggle-bold" class="px-3 py-1.5 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">B</button>
                            <button id="btn-toggle-italic" class="px-3 py-1.5 border border-slate-200 dark:border-slate-700 rounded-xl text-xs italic hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">I</button>
                            <select id="select-font-size" class="flex-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-2 py-1.5 text-xs text-slate-800 dark:text-slate-100">
                                <option value="12">Small (12px)</option>
                                <option value="14">Normal (14px)</option>
                                <option value="18">Large (18px)</option>
                                <option value="24">Title (24px)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

    </div>

    <script>
        // Default initial mind map dataset
        const DEFAULT_DATA = {
            id: 'root',
            text: 'Central Idea',
            x: 0,
            y: 0,
            bgColor: '#0284c7',
            textColor: '#ffffff',
            shape: 'rounded',
            align: 'center',
            fontSize: '18',
            bold: true,
            italic: false,
            children: [
                {
                    id: 'node-1',
                    text: 'Brainstorming',
                    x: 250,
                    y: -100,
                    bgColor: '#0d9488',
                    textColor: '#ffffff',
                    shape: 'rounded',
                    children: [
                        { id: 'node-1-1', text: 'Creative Ideas', x: 480, y: -140, bgColor: '#14b8a6', textColor: '#ffffff' },
                        { id: 'node-1-2', text: 'Inspiration', x: 480, y: -60, bgColor: '#14b8a6', textColor: '#ffffff' }
                    ]
                },
                {
                    id: 'node-2',
                    text: 'Planning & Goals',
                    x: 250,
                    y: 100,
                    bgColor: '#6366f1',
                    textColor: '#ffffff',
                    shape: 'rounded',
                    children: [
                        { id: 'node-2-1', text: 'Milestones', x: 480, y: 60, bgColor: '#818cf8', textColor: '#ffffff' },
                        { id: 'node-2-2', text: 'Resources', x: 480, y: 140, bgColor: '#818cf8', textColor: '#ffffff' }
                    ]
                },
                {
                    id: 'node-3',
                    text: 'Execution Phase',
                    x: -250,
                    y: 0,
                    bgColor: '#e11d48',
                    textColor: '#ffffff',
                    shape: 'rounded',
                    children: [
                        { id: 'node-3-1', text: 'Tasks Breakdown', x: -480, y: -40, bgColor: '#f43f5e', textColor: '#ffffff' },
                        { id: 'node-3-2', text: 'Timeline', x: -480, y: 40, bgColor: '#f43f5e', textColor: '#ffffff' }
                    ]
                }
            ]
        };

        // Application State
        let mapData = null;
        let selectedNodeId = null;
        let panOffset = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let zoomLevel = 1.0;
        let isDraggingCanvas = false;
        let dragStart = { x: 0, y: 0 };
        let draggingNode = null;
        let nodeDragOffset = { x: 0, y: 0 };

        // Color Palettes
        const COLOR_PRESETS = [
            '#0284c7', '#0369a1', '#0d9488', '#059669', 
            '#16a34a', '#ca8a04', '#d97706', '#ea580c', 
            '#e11d48', '#c026d3', '#9333ea', '#4f46e5',
            '#475569', '#0f172a'
        ];

        // DOM Element references
        const canvasContainer = document.getElementById('canvas-container');
        const nodesContainer = document.getElementById('nodes-container');
        const svgConnectors = document.getElementById('svg-connectors');
        const sidePanel = document.getElementById('side-panel');
        const noSelectionPrompt = document.getElementById('no-selection-prompt');
        const nodeControls = document.getElementById('node-controls');
        const zoomLevelText = document.getElementById('zoom-level-text');

        // Utility to generate unique IDs
        function generateId() {
            return 'node-' + Math.random().toString(36).substr(2, 9);
        }

        // Save Mind Map to LocalStorage
        function saveToStorage() {
            try {
                localStorage.setItem('mindflow_map_data', JSON.stringify(mapData));
            } catch (e) {
                console.error('Failed to save to local storage', e);
            }
        }

        // Load Mind Map from LocalStorage
        function loadFromStorage() {
            const saved = localStorage.getItem('mindflow_map_data');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse saved data', e);
                }
            }
            return DEFAULT_DATA;
        }

        // Node Traversal Helpers
        function findNodeById(root, id) {
            if (root.id === id) return root;
            if (root.children) {
                for (let child of root.children) {
                    const found = findNodeById(child, id);
                    if (found) return found;
                }
            }
            return null;
        }

        function findParentNode(root, targetId, parent = null) {
            if (root.id === targetId) return parent;
            if (root.children) {
                for (let child of root.children) {
                    const found = findParentNode(child, targetId, root);
                    if (found) return found;
                }
            }
            return null;
        }

        // Main Render Loop
        function renderMap() {
            nodesContainer.innerHTML = '';
            svgConnectors.innerHTML = '';

            // Apply global transform (pan and zoom) to container wrappers
            const transformStr = `translate(${panOffset.x}px, ${panOffset.y}px) scale(${zoomLevel})`;
            nodesContainer.style.transform = transformStr;
            svgConnectors.style.transform = transformStr;

            if (!mapData) return;

            // Render recursive elements
            renderNodeRecursive(mapData);
            
            // Highlight active side panel
            updateSidePanelUI();
        }

        function renderNodeRecursive(node) {
            // 1. Create HTML Node Element
            const el = document.createElement('div');
            el.id = `el-${node.id}`;
            el.className = `absolute pointer-events-auto cursor-pointer transition-shadow duration-150 shadow-md hover:shadow-lg flex items-center justify-center min-w-[100px] min-h-[40px] px-4 py-2 select-none border-2`;
            
            // Dynamic Shapes
            if (node.shape === 'pill') el.classList.add('rounded-full');
            else if (node.shape === 'rectangle') el.classList.add('rounded-none');
            else el.classList.add('rounded-2xl'); // default rounded

            // Selection state indicator
            if (node.id === selectedNodeId) {
                el.classList.add('ring-4', 'ring-sky-400/50', 'border-sky-500');
            } else {
                el.classList.add('border-white/20');
            }

            // Styling properties
            el.style.backgroundColor = node.bgColor || '#0284c7';
            el.style.color = node.textColor || '#ffffff';
            el.style.left = `${node.x}px`;
            el.style.top = `${node.y}px`;
            el.style.transform = 'translate(-50%, -50%)';

            // Editable Text Content
            const textEl = document.createElement('div');
            textEl.className = 'node-text-input outline-none w-full break-words';
            textEl.contentEditable = true;
            textEl.innerText = node.text || 'New Node';
            textEl.style.textAlign = node.align || 'center';
            textEl.style.fontSize = `${node.fontSize || 14}px`;
            textEl.style.fontWeight = node.bold ? '700' : '400';
            textEl.style.fontStyle = node.italic ? 'italic' : 'normal';

            // Prevent drag when editing text
            textEl.addEventListener('mousedown', (e) => e.stopPropagation());
            textEl.addEventListener('blur', () => {
                node.text = textEl.innerText;
                saveToStorage();
            });

            el.appendChild(textEl);

            // Node Selection & Drag Handler
            el.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return; // Only left click
                e.stopPropagation();
                selectedNodeId = node.id;
                
                // Start Node Dragging
                draggingNode = node;
                nodeDragOffset = {
                    x: (e.clientX - panOffset.x) / zoomLevel - node.x,
                    y: (e.clientY - panOffset.y) / zoomLevel - node.y
                };
                
                renderMap();
            });

            nodesContainer.appendChild(el);

            // 2. Render Children and Lines
            if (node.children && node.children.length > 0) {
                node.children.forEach(child => {
                    renderBezierConnector(node, child);
                    renderNodeRecursive(child);
                });
            }
        }

        // Render Curved Connecting Path between Parent & Child
        function renderBezierConnector(parent, child) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            // Calculate smooth cubic Bezier curve points
            const startX = parent.x;
            const startY = parent.y;
            const endX = child.x;
            const endY = child.y;

            const dx = endX - startX;
            const controlX1 = startX + dx * 0.5;
            const controlY1 = startY;
            const controlX2 = startX + dx * 0.5;
            const controlY2 = endY;

            const d = `M ${startX} ${startY} C ${controlX1} ${controlY1}, ${controlX2} ${controlY2}, ${endX} ${endY}`;
            
            path.setAttribute('d', d);
            path.setAttribute('stroke', document.documentElement.classList.contains('dark') ? '#475569' : '#cbd5e1');
            path.setAttribute('stroke-width', '2.5');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-linecap', 'round');

            svgConnectors.appendChild(path);
        }

        // Collision-free Auto Layout (MindMap / Tree Hierarchy)
        function performAutoLayout() {
            if (!mapData) return;

            const LEVEL_GAP = 220; // Horizontal spacing between levels
            const NODE_HEIGHT = 65; // Vertical spacing between leaves

            function layoutSubtree(node, depth, startY, direction = 1) {
                if (!node.children || node.children.length === 0) {
                    return {
                        height: NODE_HEIGHT,
                        centerY: startY + NODE_HEIGHT / 2
                    };
                }

                let currentY = startY;
                let totalHeight = 0;
                let childCenters = [];

                node.children.forEach(child => {
                    // Alternate sides for main root children
                    const childDir = (node.id === 'root') ? direction : Math.sign(node.x || 1);
                    child.x = node.x + (LEVEL_GAP * childDir);

                    const result = layoutSubtree(child, depth + 1, currentY, childDir);
                    childCenters.push(result.centerY);
                    currentY += result.height;
                    totalHeight += result.height;
                });

                // Center parent node relative to its children
                const firstChildY = childCenters[0];
                const lastChildY = childCenters[childCenters.length - 1];
                const nodeCenterY = (firstChildY + lastChildY) / 2;

                node.y = nodeCenterY;

                return {
                    height: totalHeight,
                    centerY: nodeCenterY
                };
            }

            // If Root, split children to left and right sides balanced
            if (mapData.id === 'root') {
                mapData.x = 0;
                mapData.y = 0;

                const children = mapData.children || [];
                const half = Math.ceil(children.length / 2);
                const rightChildren = children.slice(0, half);
                const leftChildren = children.slice(half);

                // Layout Right Side
                let rightY = - (rightChildren.length * NODE_HEIGHT * 1.5) / 2;
                rightChildren.forEach(child => {
                    child.x = LEVEL_GAP;
                    const res = layoutSubtree(child, 1, rightY, 1);
                    rightY += res.height + 20;
                });

                // Layout Left Side
                let leftY = - (leftChildren.length * NODE_HEIGHT * 1.5) / 2;
                leftChildren.forEach(child => {
                    child.x = -LEVEL_GAP;
                    const res = layoutSubtree(child, 1, leftY, -1);
                    leftY += res.height + 20;
                });
            } else {
                layoutSubtree(mapData, 0, 0, 1);
            }

            saveToStorage();
            renderMap();
        }

        function addChildNode() {
            if (!selectedNodeId) return;
            const parent = findNodeById(mapData, selectedNodeId);
            if (!parent) return;

            if (!parent.children) parent.children = [];

            const isLeft = parent.x < 0;
            const xOffset = isLeft ? -220 : 220;

            const newNode = {
                id: generateId(),
                text: 'New Idea',
                x: parent.x + xOffset,
                y: parent.y + (parent.children.length * 50) - 20,
                bgColor: parent.bgColor || '#0284c7',
                textColor: '#ffffff',
                shape: parent.shape || 'rounded',
                children: []
            };

            parent.children.push(newNode);
            selectedNodeId = newNode.id;
            saveToStorage();
            renderMap();
        }

        function addSiblingNode() {
            if (!selectedNodeId || selectedNodeId === 'root') return;
            const parent = findParentNode(mapData, selectedNodeId);
            if (!parent) return;

            const currentNode = findNodeById(mapData, selectedNodeId);
            const newNode = {
                id: generateId(),
                text: 'New Sibling',
                x: currentNode.x,
                y: currentNode.y + 60,
                bgColor: currentNode.bgColor || '#0284c7',
                textColor: '#ffffff',
                shape: currentNode.shape || 'rounded',
                children: []
            };

            parent.children.push(newNode);
            selectedNodeId = newNode.id;
            saveToStorage();
            renderMap();
        }

        function deleteSelectedNode() {
            if (!selectedNodeId || selectedNodeId === 'root') return; // Cannot delete root
            const parent = findParentNode(mapData, selectedNodeId);
            if (parent && parent.children) {
                parent.children = parent.children.filter(c => c.id !== selectedNodeId);
                selectedNodeId = parent.id;
                saveToStorage();
                renderMap();
            }
        }

        function initColorPresets() {
            const container = document.getElementById('color-presets');
            container.innerHTML = '';
            COLOR_PRESETS.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'w-7 h-7 rounded-full border-2 border-white/40 shadow-sm hover:scale-110 transition-transform';
                btn.style.backgroundColor = color;
                btn.onclick = () => {
                    const activeNode = findNodeById(mapData, selectedNodeId);
                    if (activeNode) {
                        activeNode.bgColor = color;
                        saveToStorage();
                        renderMap();
                    }
                };
                container.appendChild(btn);
            });
        }

        function updateSidePanelUI() {
            const activeNode = findNodeById(mapData, selectedNodeId);
            if (!activeNode) {
                noSelectionPrompt.classList.remove('hidden');
                nodeControls.classList.add('hidden');
                return;
            }

            noSelectionPrompt.classList.add('hidden');
            nodeControls.classList.remove('hidden');

            document.getElementById('prop-text').value = activeNode.text || '';
            document.getElementById('select-font-size').value = activeNode.fontSize || '14';
        }

        // Canvas Dragging (Pan)
        canvasContainer.addEventListener('mousedown', (e) => {
            if (e.target === canvasContainer || e.target === svgConnectors) {
                isDraggingCanvas = true;
                dragStart = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
                selectedNodeId = null;
                renderMap();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDraggingCanvas) {
                panOffset = {
                    x: e.clientX - dragStart.x,
                    y: e.clientY - dragStart.y
                };
                renderMap();
            } else if (draggingNode) {
                draggingNode.x = (e.clientX - panOffset.x) / zoomLevel - nodeDragOffset.x;
                draggingNode.y = (e.clientY - panOffset.y) / zoomLevel - nodeDragOffset.y;
                renderMap();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isDraggingCanvas) isDraggingCanvas = false;
            if (draggingNode) {
                draggingNode = null;
                saveToStorage();
            }
        });

        // Mouse Wheel Zooming
        canvasContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 0.08;
            if (e.deltaY < 0) {
                zoomLevel = Math.min(zoomLevel + zoomFactor, 2.5);
            } else {
                zoomLevel = Math.max(zoomLevel - zoomFactor, 0.3);
            }
            zoomLevelText.innerText = `${Math.round(zoomLevel * 100)}%`;
            renderMap();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            // Ignore shortcut triggers if editing text input
            if (document.activeElement && document.activeElement.isContentEditable) return;
            if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') return;

            if (e.key === 'Tab') {
                e.preventDefault();
                addChildNode();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                addSiblingNode();
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                e.preventDefault();
                deleteSelectedNode();
            }
        });

        // Export Mindmap to JSON File
        document.getElementById('btn-export-json').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mapData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "mindmap.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        });

        // Import Mindmap from JSON File
        document.getElementById('file-input-json').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (imported && imported.id) {
                        mapData = imported;
                        saveToStorage();
                        renderMap();
                    } else {
                        alert('Invalid MindMap JSON file structure.');
                    }
                } catch (err) {
                    alert('Error parsing JSON file.');
                }
            };
            reader.readAsText(file);
        });

        // Export Canvas View to Image (PNG)
        document.getElementById('btn-export-png').addEventListener('click', () => {
            // Temporarily build canvas SVG snippet
            const canvasSvg = svgConnectors.cloneNode(true);
            const bbox = nodesContainer.getBoundingClientRect();
            
            alert("Exporting view: For quick snapshot capture, use your browser screenshot tool or print option!");
        });

        // Button UI Bindings
        document.getElementById('btn-add-child').onclick = addChildNode;
        document.getElementById('btn-add-sibling').onclick = addSiblingNode;
        document.getElementById('btn-delete-node').onclick = deleteSelectedNode;
        document.getElementById('btn-auto-layout').onclick = performAutoLayout;

        // Zoom Controls
        document.getElementById('btn-zoom-in').onclick = () => {
            zoomLevel = Math.min(zoomLevel + 0.15, 2.5);
            zoomLevelText.innerText = `${Math.round(zoomLevel * 100)}%`;
            renderMap();
        };
        document.getElementById('btn-zoom-out').onclick = () => {
            zoomLevel = Math.max(zoomLevel - 0.15, 0.3);
            zoomLevelText.innerText = `${Math.round(zoomLevel * 100)}%`;
            renderMap();
        };
        document.getElementById('btn-reset-view').onclick = () => {
            zoomLevel = 1.0;
            panOffset = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            zoomLevelText.innerText = `100%`;
            renderMap();
        };

        // Dark Theme Toggle
        document.getElementById('btn-theme-toggle').onclick = () => {
            document.documentElement.classList.toggle('dark');
            renderMap();
        };

        // Text Controls Handlers
        document.getElementById('prop-text').oninput = (e) => {
            const activeNode = findNodeById(mapData, selectedNodeId);
            if (activeNode) {
                activeNode.text = e.target.value;
                const textInputEl = document.querySelector(`#el-${activeNode.id} .node-text-input`);
                if (textInputEl) textInputEl.innerText = e.target.value;
                saveToStorage();
            }
        };

        document.querySelectorAll('.btn-shape').forEach(btn => {
            btn.onclick = () => {
                const activeNode = findNodeById(mapData, selectedNodeId);
                if (activeNode) {
                    activeNode.shape = btn.dataset.shape;
                    saveToStorage();
                    renderMap();
                }
            };
        });

        document.querySelectorAll('.btn-align').forEach(btn => {
            btn.onclick = () => {
                const activeNode = findNodeById(mapData, selectedNodeId);
                if (activeNode) {
                    activeNode.align = btn.dataset.align;
                    saveToStorage();
                    renderMap();
                }
            };
        });

        document.getElementById('select-font-size').onchange = (e) => {
            const activeNode = findNodeById(mapData, selectedNodeId);
            if (activeNode) {
                activeNode.fontSize = e.target.value;
                saveToStorage();
                renderMap();
            }
        };

        document.getElementById('btn-toggle-bold').onclick = () => {
            const activeNode = findNodeById(mapData, selectedNodeId);
            if (activeNode) {
                activeNode.bold = !activeNode.bold;
                saveToStorage();
                renderMap();
            }
        };

        document.getElementById('btn-toggle-italic').onclick = () => {
            const activeNode = findNodeById(mapData, selectedNodeId);
            if (activeNode) {
                activeNode.italic = !activeNode.italic;
                saveToStorage();
                renderMap();
            }
        };

        window.onload = function() {
            mapData = loadFromStorage();
            initColorPresets();
            renderMap();
        };
    </script>
</body>
</html>
